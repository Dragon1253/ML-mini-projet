<!DOCTYPE html>
<html>
<head>
    <title>Test APIs</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { margin: 10px; padding: 10px; }
        pre { background: #f0f0f0; padding: 10px; overflow: auto; max-height: 300px; }
        .result { border: 1px solid #ccc; margin: 10px 0; padding: 10px; }
    </style>
</head>
<body>
    <h1>Test Uber Analytics APIs</h1>
    
    <button onclick="testAPI('/api/cluster-summary')">Test Cluster Summary</button>
    <button onclick="testAPI('/api/heatmap-data')">Test Heatmap Data</button>
    <button onclick="testAPI('/api/clusters-data')">Test Clusters Data</button>
    <button onclick="testAPI('/api/insights')">Test Insights</button>
    <button onclick="testAPI('/api/economic-analysis')">Test Economic Analysis</button>
    <button onclick="testAPI('/api/temporal-analysis')">Test Temporal Analysis</button>
    
    <div id="results"></div>

    <script>
        function testAPI(endpoint) {
            const resultsDiv = document.getElementById('results');
            
            fetch(endpoint)
                .then(response => {
                    console.log(`${endpoint} status:`, response.status);
                    return response.json();
                })
                .then(data => {
                    console.log(`${endpoint} data:`, data);
                    
                    const resultDiv = document.createElement('div');
                    resultDiv.className = 'result';
                    resultDiv.innerHTML = `
                        <h3>${endpoint}</h3>
                        <p><strong>Status:</strong> Success</p>
                        <p><strong>Data length:</strong> ${Array.isArray(data) ? data.length : 'Not an array'}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                    resultsDiv.appendChild(resultDiv);
                })
                .catch(error => {
                    console.error(`${endpoint} error:`, error);
                    
                    const resultDiv = document.createElement('div');
                    resultDiv.className = 'result';
                    resultDiv.innerHTML = `
                        <h3>${endpoint}</h3>
                        <p><strong>Status:</strong> Error</p>
                        <p><strong>Error:</strong> ${error.message}</p>
                    `;
                    resultsDiv.appendChild(resultDiv);
                });
        }
    </script>
</body>
</html>
